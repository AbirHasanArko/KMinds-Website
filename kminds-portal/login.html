<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your KMinds account and access your dashboard.">
  <title>KMinds | Login</title>
  <link rel="stylesheet" href="assets/css/main.css?v=3">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">K</div>
        <span class="logo-text">KMinds</span>
      </a>
      <nav aria-label="Auth navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="login.html" aria-current="page">Login</a></li>
          <li><a href="signup.html">Sign Up</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section style="max-width:480px;margin:2rem auto">
      <div style="text-align:center;margin-bottom:1.5rem">
        <div class="avatar" style="margin:0 auto 1rem;width:64px;height:64px;font-size:1.3rem">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <h2 id="login-heading" style="background:linear-gradient(135deg,var(--hero-title-start),var(--brand));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:1.6rem">Welcome Back</h2>
        <p>Sign in with your KUET student email</p>
      </div>

      <form action="#" method="post" id="login-form">
        <div class="form-group">
          <label for="login-email">Institutional Email</label>
          <input id="login-email" name="email" type="email" placeholder="example@stud.kuet.ac.bd" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" required minlength="8" autocomplete="current-password">
        </div>
        <button type="submit">Sign In</button>
      </form>

      <p style="text-align:center;margin-top:1.25rem">
        New member? <a href="signup.html">Create an account</a>
      </p>
    </section>

    <section style="max-width:480px;margin:0 auto" aria-labelledby="payment-proof-heading">
      <h2 id="payment-proof-heading">Payment Verification</h2>
      <p style="margin-bottom:1rem">New members must submit a bKash transaction reference to verify boarding fee payment after signing up.</p>
      <form action="#" method="post" id="bkash-login-form">
        <div class="form-group">
          <label for="bkash-ref">bKash Transaction Reference</label>
          <input id="bkash-ref" name="bkash_reference" type="text" minlength="6" placeholder="e.g. TXN12345AB" required>
        </div>
        <button type="submit">Submit Reference</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 KMinds — KUET Data Science, AI & ML Club</p>
  </footer>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
