<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Join KMinds — register with your KUET student email.">
  <title>KMinds | Sign Up</title>
  <link rel="stylesheet" href="assets/css/main.css?v=3">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">K</div>
        <span class="logo-text">KMinds</span>
      </a>
      <nav aria-label="Auth navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="login.html">Login</a></li>
          <li><a href="signup.html" aria-current="page">Sign Up</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section style="max-width:560px;margin:1.5rem auto" aria-labelledby="signup-heading">
      <div style="text-align:center;margin-bottom:1.5rem">
        <div class="avatar" style="margin:0 auto 1rem;width:64px;height:64px;font-size:1.3rem">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        </div>
        <h2 id="signup-heading" style="background:linear-gradient(135deg,var(--hero-title-start),var(--brand));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-size:1.6rem">Join KMinds</h2>
        <p>Use your KUET student email (@stud.kuet.ac.bd)</p>
      </div>

      <form action="#" method="post" id="signup-form">
        <div class="form-row">
          <div class="form-group">
            <label for="full-name">Full Name</label>
            <input id="full-name" name="name" type="text" placeholder="Your full name" required>
          </div>
          <div class="form-group">
            <label for="roll">Roll Number</label>
            <input id="roll" name="roll" type="text" placeholder="e.g. 2105001" required>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email (@stud.kuet.ac.bd)</label>
          <input id="email" name="email" type="email" placeholder="yourid@stud.kuet.ac.bd" pattern="^[^@\s]+@stud\.kuet\.ac\.bd$" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="department">Department</label>
            <select id="department" name="department" required>
              <option value="" selected disabled>Select Dept</option>
              <option value="EEE">EEE</option>
              <option value="CSE">CSE</option>
              <option value="ECE">ECE</option>
              <option value="BME">BME</option>
              <option value="MSE">MSE</option>
              <option value="MTE">MTE</option>
              <option value="ME">ME</option>
              <option value="IEM">IEM</option>
              <option value="TE">TE</option>
              <option value="LE">LE</option>
              <option value="ESE">ESE</option>
              <option value="ChE">ChE</option>
              <option value="CE">CE</option>
              <option value="URP">URP</option>
              <option value="BECM">BECM</option>
              <option value="ARCH">ARCH</option>
            </select>
          </div>
          <div class="form-group">
            <label for="year-term">Year-Term</label>
            <select id="year-term" name="year_term" required>
              <option value="" selected disabled>Select</option>
              <option value="1-1">1-1</option>
              <option value="1-2">1-2</option>
              <option value="2-1">2-1</option>
              <option value="2-2">2-2</option>
              <option value="3-1">3-1</option>
              <option value="3-2">3-2</option>
              <option value="4-1">4-1</option>
              <option value="4-2">4-2</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="profile-image">Profile Photo (optional)</label>
          <div class="image-upload-area" id="profile-upload-area">
            <input id="profile-image" name="profile_image" type="file" accept="image/*">
            <div class="upload-icon">📷</div>
            <p>Click or drag to upload profile photo</p>
            <img class="image-preview" id="profile-preview" alt="Profile preview">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="8" required placeholder="Min 8 characters">
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input id="confirm-password" name="confirm_password" type="password" minlength="8" required placeholder="Re-enter password">
          </div>
        </div>

        <button type="submit">Create Account</button>
      </form>

      <p style="text-align:center;margin-top:1rem">
        Already have an account? <a href="login.html">Sign in</a>
      </p>
    </section>
  </main>

  <footer class="site-footer">
    <p>© 2026 KMinds — KUET Data Science, AI & ML Club</p>
  </footer>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
